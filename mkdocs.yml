site_name: AI Glossary
site_description: Plain-English explanations of AI terms, concepts, and technologies
site_url: https://kctofel.github.io/ai-glossary/
repo_url: https://github.com/kctofel/ai-glossary/
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    primary: indigo
    accent: amber
  features:
    - navigation.instant
    - navigation.tracking
    - search.highlight
    - content.code.copy
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Tier 1 — Foundational:
      - What is AI?: tier1/what-is-ai.md
      - Machine Learning: tier1/machine-learning.md
      - Deep Learning: tier1/deep-learning.md
      - Tokens & Tokenization: tier1/tokens-tokenization.md
      - Context Window: tier1/context-window.md
      - Prompts & Prompt Engineering: tier1/prompts.md
      - Inference vs. Training: tier1/inference-vs-training.md
      - Parameters: tier1/parameters.md
      - Temperature & Sampling: tier1/temperature-sampling.md
  - Tier 2 — Model Architecture:
      - LLM (Large Language Model): tier2/llm.md
      - Transformer: tier2/transformer.md
      - Fine-tuning: tier2/fine-tuning.md
      - RLHF: tier2/rlhf.md
      - RAG: tier2/rag.md
      - Quantization: tier2/quantization.md
      - AI Agents: tier2/agents.md
  - Tier 3 — Applications & Use Cases:
      - Chatbots: tier3/chatbots.md
      - Code Generation: tier3/code-generation.md
      - Image & Video Generation: tier3/image-video-generation.md
      - Voice Synthesis: tier3/voice-synthesis.md
      - Embeddings: tier3/embeddings.md
  - Tier 4 — Ethics, Safety & Regulation:
      - Hallucination: tier4/hallucination.md
      - Alignment: tier4/alignment.md
      - Bias: tier4/bias.md
      - Privacy: tier4/privacy.md
      - Copyright: tier4/copyright.md
      - Open Source vs. Proprietary: tier4/open-source-vs-proprietary.md
  - Tier 5 — Industry & Business:
      - APIs: tier5/apis.md
      - Compute: tier5/compute.md
      - Inference Cost: tier5/inference-cost.md
      - Model Cards: tier5/model-cards.md
      - Benchmarks: tier5/benchmarks.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true

plugins:
  - search
